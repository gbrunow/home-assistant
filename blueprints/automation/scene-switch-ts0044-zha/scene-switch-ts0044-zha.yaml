blueprint:
  name: Scene switch (TS0044, ZHA)
  description: |-
    Run actions when you press a button on a Tuya TS0044 4-button scene switch. MOES sells this switch. The blueprint works with ZHA only.

    The form has four groups. Each group picks a button and holds the actions for its single press, double press, and long press. To move all actions of a group to a different button, pick another button in the dropdown of the group.
  domain: automation
  source_url: https://github.com/gbrunow/home-assistant/blob/main/blueprints/automation/scene-switch-ts0044-zha/scene-switch-ts0044-zha.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    ts0044_device:
      name: Scene switch
      description: The TS0044 switch that runs the actions.
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: _TZ3000_wkai4ga5
              model: TS0044
          multiple: false
    notify_shared_button:
      name: Warn when groups share a button
      description: Create a notification when a press matches more than one group.
      default: true
      selector:
        boolean: {}
    group_1_button:
      name: Group 1
      description: Pick the button for this group. Then set its actions in the three sections below.
      default: "1"
      selector:
        select:
          mode: dropdown
          options:
            - value: "1"
              label: ◰ Upper-left · Button 1
            - value: "2"
              label: ◳ Upper-right · Button 2
            - value: "3"
              label: ◱ Lower-left · Button 3
            - value: "4"
              label: ◲ Lower-right · Button 4
    group_1_single:
      name: Single press
      icon: mdi:gesture-tap
      collapsed: true
      input:
        button_1_press:
          name: Actions
          description: Actions to run when you press the button one time.
          default: []
          selector:
            action: {}
    group_1_double:
      name: Double press
      icon: mdi:gesture-double-tap
      collapsed: true
      input:
        button_1_double_press:
          name: Actions
          description: Actions to run when you press the button two times quickly.
          default: []
          selector:
            action: {}
    group_1_long:
      name: Long press
      icon: mdi:gesture-tap-hold
      collapsed: true
      input:
        button_1_held:
          name: Actions
          description: Actions to run when you hold the button down.
          default: []
          selector:
            action: {}
    group_2_button:
      name: Group 2
      description: Pick the button for this group. Then set its actions in the three sections below.
      default: "2"
      selector:
        select:
          mode: dropdown
          options:
            - value: "1"
              label: ◰ Upper-left · Button 1
            - value: "2"
              label: ◳ Upper-right · Button 2
            - value: "3"
              label: ◱ Lower-left · Button 3
            - value: "4"
              label: ◲ Lower-right · Button 4
    group_2_single:
      name: Single press
      icon: mdi:gesture-tap
      collapsed: true
      input:
        button_2_press:
          name: Actions
          description: Actions to run when you press the button one time.
          default: []
          selector:
            action: {}
    group_2_double:
      name: Double press
      icon: mdi:gesture-double-tap
      collapsed: true
      input:
        button_2_double_press:
          name: Actions
          description: Actions to run when you press the button two times quickly.
          default: []
          selector:
            action: {}
    group_2_long:
      name: Long press
      icon: mdi:gesture-tap-hold
      collapsed: true
      input:
        button_2_held:
          name: Actions
          description: Actions to run when you hold the button down.
          default: []
          selector:
            action: {}
    group_3_button:
      name: Group 3
      description: Pick the button for this group. Then set its actions in the three sections below.
      default: "3"
      selector:
        select:
          mode: dropdown
          options:
            - value: "1"
              label: ◰ Upper-left · Button 1
            - value: "2"
              label: ◳ Upper-right · Button 2
            - value: "3"
              label: ◱ Lower-left · Button 3
            - value: "4"
              label: ◲ Lower-right · Button 4
    group_3_single:
      name: Single press
      icon: mdi:gesture-tap
      collapsed: true
      input:
        button_3_press:
          name: Actions
          description: Actions to run when you press the button one time.
          default: []
          selector:
            action: {}
    group_3_double:
      name: Double press
      icon: mdi:gesture-double-tap
      collapsed: true
      input:
        button_3_double_press:
          name: Actions
          description: Actions to run when you press the button two times quickly.
          default: []
          selector:
            action: {}
    group_3_long:
      name: Long press
      icon: mdi:gesture-tap-hold
      collapsed: true
      input:
        button_3_held:
          name: Actions
          description: Actions to run when you hold the button down.
          default: []
          selector:
            action: {}
    group_4_button:
      name: Group 4
      description: Pick the button for this group. Then set its actions in the three sections below.
      default: "4"
      selector:
        select:
          mode: dropdown
          options:
            - value: "1"
              label: ◰ Upper-left · Button 1
            - value: "2"
              label: ◳ Upper-right · Button 2
            - value: "3"
              label: ◱ Lower-left · Button 3
            - value: "4"
              label: ◲ Lower-right · Button 4
    group_4_single:
      name: Single press
      icon: mdi:gesture-tap
      collapsed: true
