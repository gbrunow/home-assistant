      icon: mdi:gesture-double-tap
      collapsed: true
      input:
        button_4_double_press:
          name: Actions
          description: Actions to run when you press the button two times quickly.
          default: []
          selector:
            action: {}
    group_4_long:
      name: Long press
      icon: mdi:gesture-tap-hold
      collapsed: true
      input:
        button_4_held:
          name: Actions
          description: Actions to run when you hold the button down.
          default: []
          selector:
            action: {}
mode: parallel
max_exceeded: silent

triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input ts0044_device
      command: remote_button_short_press
      endpoint_id: 1
    id: button_1_single
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input ts0044_device
      command: remote_button_double_press
      endpoint_id: 1
    id: button_1_double
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input ts0044_device
      command: remote_button_long_press
      endpoint_id: 1
    id: button_1_long
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input ts0044_device
      command: remote_button_short_press
      endpoint_id: 2
    id: button_2_single
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input ts0044_device
      command: remote_button_double_press
      endpoint_id: 2
    id: button_2_double
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input ts0044_device
      command: remote_button_long_press
      endpoint_id: 2
    id: button_2_long
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input ts0044_device
      command: remote_button_short_press
      endpoint_id: 3
    id: button_3_single
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input ts0044_device
      command: remote_button_double_press
      endpoint_id: 3
    id: button_3_double
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input ts0044_device
      command: remote_button_long_press
      endpoint_id: 3
    id: button_3_long
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input ts0044_device
      command: remote_button_short_press
      endpoint_id: 4
    id: button_4_single
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input ts0044_device
      command: remote_button_double_press
      endpoint_id: 4
    id: button_4_double
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input ts0044_device
      command: remote_button_long_press
      endpoint_id: 4
    id: button_4_long

actions:
  - variables:
      group_1: !input group_1_button
      group_2: !input group_2_button
      group_3: !input group_3_button
      group_4: !input group_4_button
      pressed: "{{ trigger.event.data.endpoint_id | string }}"
      matching_groups: >-
        {% set groups = {1: group_1, 2: group_2, 3: group_3, 4: group_4} %}
        {{ groups | dictsort | selectattr(1, 'eq', pressed) | map(attribute=0) | list }}
  - alias: Warn when groups share the pressed button
    enabled: !input notify_shared_button
    if:
      - condition: template
        value_template: "{{ matching_groups | count > 1 }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: "{{ this.entity_id }}_shared_button"
          title: "{{ this.attributes.friendly_name }}"
          message: >-
            Groups {{ matching_groups | join(', ') }} all use Button {{ pressed }}. A press on that button runs the actions of each of these groups.
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'button_' ~ group_1 ~ '_single' }}"
    then: !input button_1_press
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'button_' ~ group_1 ~ '_double' }}"
    then: !input button_1_double_press
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'button_' ~ group_1 ~ '_long' }}"
    then: !input button_1_held
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'button_' ~ group_2 ~ '_single' }}"
    then: !input button_2_press
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'button_' ~ group_2 ~ '_double' }}"
    then: !input button_2_double_press
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'button_' ~ group_2 ~ '_long' }}"
    then: !input button_2_held
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'button_' ~ group_3 ~ '_single' }}"
    then: !input button_3_press
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'button_' ~ group_3 ~ '_double' }}"
    then: !input button_3_double_press
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'button_' ~ group_3 ~ '_long' }}"
    then: !input button_3_held
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'button_' ~ group_4 ~ '_single' }}"
    then: !input button_4_press
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'button_' ~ group_4 ~ '_double' }}"
    then: !input button_4_double_press
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'button_' ~ group_4 ~ '_long' }}"
    then: !input button_4_held
